permissions:
  contents: read
  pull-requests: write

name: Release Preview

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  release_preview:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: OpenVoiceOS/gh-automations/.github/workflows/release-preview.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      package_name: 'hivemind_ovos_agent_plugin'
      version_file: 'hivemind_ovos_agent_plugin/version.py'
