permissions:
  contents: read
  pull-requests: write

name: Repo Health

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  repo_health:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: OpenVoiceOS/gh-automations/.github/workflows/repo-health.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      version_file: 'hivemind_ovos_agent_plugin/version.py'
