permissions:
  # The pinned reusable workflow declares contents:write for its optional
  # Pages path; GitHub validates that permission even when Pages is disabled.
  contents: write
  pull-requests: write

name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_ovos_agent_plugin'
      test_path: 'tests/'
      # install_extras intentionally unset — the upstream workflow's
      # `.[dev]` first-attempt path covers our test deps via the dev
      # extras alias in pyproject.toml. Setting `install_extras: 'test'`
      # triggers a buggy `pip install test` literal in gh-automations
      # that tries to install a PyPI package named "test".
      min_coverage: 0
      # hivescope + plugin-manager pinned to released PyPI prereleases;
      pre_install_pip: '"hivescope==0.3.0a1" "hivemind-plugin-manager==0.6.0a1" "hivemind-core==4.3.0a2"'
      pr_comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
