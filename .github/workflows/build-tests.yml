permissions:
  contents: read
  pull-requests: write

name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@e1770fb608f8c39ab886ff336f6470ee17747b0d # dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      # version policy lives in pyproject.toml; just install the test extra
      # (pulls hivescope + the compatible hivemind-core stack via the
      # declared floors).
      install_extras: 'test'
      test_path: 'tests'
      pr_comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
