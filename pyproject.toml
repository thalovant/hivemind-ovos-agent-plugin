[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-ovos-agent-plugin"
dynamic = ["version"]
description = "OVOS agent protocol plugin for HiveMind-core"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ovos-bus-client>=2.0.0a3",
    "ovos-config>=0.0.12,<3.0.0",
    "ovos-utils>=0.8.2,<1.0.0",
    "hivemind-bus-client>=0.7.0a2,<1.0.0",
    # NOTE: floor stays at 0.5.0 while #27 is in CI as a branch install
    # (gh-automations only bumps version.py on merge to dev). Tighten
    # to >=0.6.0a1 once #27 is released.
    "hivemind-plugin-manager>=0.5.0,<1.0.0",
    "pyee>=13.0.1,<13.1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.5.2a1",
]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without `dev` it falls through to a buggy `pip install test`
# literal branch in the upstream workflow.
dev = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.5.2a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin"
Issues = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin/issues"

[project.entry-points."hivemind.agent.protocol"]
"hivemind-ovos-agent-plugin" = "hivemind_ovos_agent_plugin:OVOSAgentProtocol"

[project.entry-points."hivemind.policy"]
"hivemind-ovos-agent-policy" = "hivemind_ovos_agent_plugin.policy:OVOSAgentPolicy"

[tool.setuptools.dynamic]
version = { attr = "hivemind_ovos_agent_plugin.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_ovos_agent_plugin*"]
