[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-ovos-agent-plugin"
dynamic = ["version"]
description = "OVOS agent protocol plugin for HiveMind-core"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.10"
dependencies = [
    # 2.6.5a1 clears connected_event on websocket close/error, which makes
    # get_bus() and wait_for_bus() health checks authoritative.
    "ovos-bus-client>=2.6.5a1,<3.0.0",
    "ovos-config>=0.0.12,<3.0.0",
    "ovos-spec-tools>=1.5.1a2,<2.0.0",
    "ovos-utils>=0.8.2,<1.0.0",
    "hivemind-bus-client>=1.0.0a1,<2.0.0",
    # 0.8.0a1 introduced the client-aware get_bus/answer_query contract used
    # by runtime sharding in the stacked PR.
    "hivemind-plugin-manager>=0.8.0a1,<1.0.0",
    # EventEmitter is imported directly and therefore is a direct dependency.
    "pyee>=8.1.0,<13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.5.2a1",
]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without `dev` it falls through to a buggy `pip install test`
# literal branch in the upstream workflow.
dev = [
    "pytest",
    "pytest-cov",
    "hivescope>=0.5.2a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin"
Issues = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin/issues"

[project.entry-points."hivemind.agent.protocol"]
"hivemind-ovos-agent-plugin" = "hivemind_ovos_agent_plugin:OVOSAgentProtocol"

[project.entry-points."hivemind.policy"]
"hivemind-ovos-agent-policy" = "hivemind_ovos_agent_plugin.policy:OVOSAgentPolicy"

[project.entry-points."hivemind.performance.metrics"]
ovos-agent = "hivemind_ovos_agent_plugin._metrics:performance_histograms"

[tool.setuptools.dynamic]
version = { attr = "hivemind_ovos_agent_plugin.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_ovos_agent_plugin*"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a live OVOS skill pipeline",
]
